# Xcode-Projekt wird aus dieser Datei erzeugt: `xcodegen generate`
name: Rapt
options:
  bundleIdPrefix: de.ncls
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Team: aketo GmbH. Hier die 10-stellige Team-ID eintragen (developer.apple.com → Account → Membership).
    DEVELOPMENT_TEAM: ""

packages:
  RaptCore:
    path: Packages/RaptCore

targets:
  Rapt:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: RaptCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.ncls.rapt
        PRODUCT_NAME: Rapt
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rapt
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.puzzle-games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets:
        - package: RaptCore/RaptCoreTests
