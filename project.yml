# Xcode-Projekt wird aus dieser Datei erzeugt: `xcodegen generate`
name: Rapt
options:
  bundleIdPrefix: de.ncls
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.4"
    CURRENT_PROJECT_VERSION: "12"
    # Team: aketo GmbH
    DEVELOPMENT_TEAM: 9H7F5NMT97

packages:
  RaptCore:
    path: Packages/RaptCore

targets:
  Rapt:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: RaptCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.ncls.rapt
        PRODUCT_NAME: Rapt
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rapt
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.puzzle-games
        # Exportkontrolle: keine eigene Verschlüsselung → kein „Missing Compliance“ in App Store Connect
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Startbildschirm mit Key-Art aus App/Info.plist (LaunchImage, LaunchBackground).
        # Zurück zum schlichten schwarzen Start: die Zeile INFOPLIST_FILE durch
        # `INFOPLIST_KEY_UILaunchScreen_Generation: YES` ersetzen und `xcodegen generate` ausführen.
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_UIStatusBarHidden: YES
        # Ergebniskarte aus dem Teilen-Menü in Fotos sichern (sonst Absturz bei „Bild sichern“)
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "Rapt sichert deine Ergebniskarte in Fotos."
        # Alle Ausrichtungen erlaubt; ScreenFit (AppDelegate) hält kleine Fenster im Hochformat, große (iPhone Duo
        # aufgeklappt, iPad) drehen frei. Ohne UIRequiresFullScreen (veraltet), die Szene passt sich jeder Größe an.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Zweites Icon, in den Einstellungen wählbar (iOS: setAlternateIconName)
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIconAlt AppIconAlt2"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: YES
        # Game Center (Bestenlisten, Erfolge); der Mac braucht dafür ausgehende Verbindungen
        CODE_SIGN_ENTITLEMENTS: App/Rapt.entitlements
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets:
        - package: RaptCore/RaptCoreTests
